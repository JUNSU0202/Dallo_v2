[pytest]
# Wave 1-A 테스트 인프라 안전망:
# - pythonpath 으로 프로젝트 루트를 모듈 검색 경로에 추가하여
#   각 테스트 파일 상단의 sys.path.insert 보일러플레이트를 점진적으로 제거 가능.
# - 기존 sys.path.insert 코드는 호환성을 위해 그대로 유지 (광범위 리팩터 회피).
pythonpath = .

testpaths = tests

# 명시적 컬렉션 규칙 (디폴트와 동일하지만 명문화)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 향후 통합/외부 의존 테스트 분리를 위한 마커 사전 등록
markers =
    integration: 외부 시스템 또는 다단계 파이프라인이 관여하는 통합 테스트
    slow: 실행 시간이 길어 일반 CI 단계에서 분리하고 싶은 테스트
