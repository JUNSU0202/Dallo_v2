# Dallo 로컬 Semgrep 룰셋 (Wave 5-H4)
#
# - 본 파일은 저장소-로컬 Semgrep 룰만 정의한다. registry, cloud, URL,
#   token 기반 private config 는 사용하지 않는다.
# - detect_and_run() 오케스트레이션 경로에서만 자동 탐지 모드와 함께 다중
#   config 로 활성화된다 (SemgrepRunner 기본 생성자에는 영향 없음).
# - 룰은 보수적으로 시작한다. 본 wave 의 목표는 안전한 로컬 룰셋 plumbing
#   과 활성화이며, 룰 자체의 완성도가 아니다.
rules:
  - id: dallo-local-auth-bypass-empty-credential
    languages:
      - python
    severity: WARNING
    message: >-
      잠재적 인증 우회 (CWE-288): 빈 문자열 비교로 사용자 패스워드/토큰을
      검증하는 패턴은 인증 우회로 이어질 수 있다. 명시적 비교 대신 안전한
      검증 함수를 사용하라.
    metadata:
      cwe:
        - "CWE-288: Authentication Bypass Using an Alternate Path or Channel"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: LOW
      source: dallo-local
    patterns:
      - pattern-either:
          - pattern: |
              if $USER.password == "":
                  ...
          - pattern: |
              if $TOKEN == "":
                  ...
